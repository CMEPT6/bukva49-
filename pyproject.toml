[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bukva49"
version = "0.7.0"
description = "Lightweight, zero-dependency neuro-symbolic cognitive pipeline and DSL based on the 7x7 matrix architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BUKVA-49 Project Contributors" }
]
keywords = [
    "neuro-symbolic",
    "fsm",
    "cognitive-architecture",
    "dsl",
    "pipeline",
    "agents",
    "deterministic-ai",
    "zero-dependency"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/CMEPT6/bukva49-"
Documentation = "https://github.com/CMEPT6/bukva49-#readme"
Repository = "https://github.com/CMEPT6/bukva49-.git"
Issues = "https://github.com/CMEPT6/bukva49-/issues"

[project.scripts]
bukva49 = "bukva49.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
